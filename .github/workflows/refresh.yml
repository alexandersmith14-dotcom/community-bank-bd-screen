name: Refresh dashboard

# Rebuilds the target list + dashboard from the latest FDIC data, publishes the
# dashboard to GitHub Pages, and commits the output CSVs (targets, all_banks,
# salesforce_import, signal_summary, cu/ft variants) so they stay in sync. Runs
# weekly (FDIC data changes quarterly, so most runs are no-ops) and on demand
# from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"   # avoid retriggering on the workflow's own publish commit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Required by api.fdic.gov starting 2026-09-08. Registered at api.data.gov.
      FDIC_API_KEY: ${{ secrets.FDIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests numpy pdfplumber rapidfuzz playwright lxml openpyxl
      - run: playwright install --with-deps chromium
      - run: python 01_fetch.py       # current-quarter snapshot
      - run: python 02_screen.py      # snapshot signals + all_banks.csv
      - run: python 04_history.py     # 20 quarters of history
      - run: python 05_trajectory.py  # trend features -> enriched targets.csv
      - run: python 12_sod_market_share.py  # deposit market share / HHI (FDIC SOD)
      - run: python 13_bank_events.py  # recent mergers + failed-bank acquisitions
      - run: python 14_consent_orders.py  # FDIC formal enforcement actions (ED&O)
      - run: python 06_edgar.py       # SEC EDGAR officers for public banks
      - run: python 07_cu_fetch.py    # NCUA credit-union data
      - run: python 08_cu_screen.py   # credit-union RAS targets
      - run: python 10_cu_trajectory.py  # credit-union 5-year trajectory
      - run: python 09_fintech.py     # fintech (FinCEN MSB) RAS targets
      - run: python 11_state_licenses.py  # cross-check fintechs vs real state MT rosters
      - run: python 03_dashboard.py   # dashboard (banks + credit unions + fintechs)
      - run: cp output/dashboard.html docs/index.html
      - name: Commit if the dashboard or output CSVs changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git add -f output/*.csv
          git diff --staged --quiet || git commit -m "Auto-refresh dashboard + output CSVs from latest FDIC data"
          git push
